<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TermAway">
  <meta name="theme-color" content="#1a1a2e">
  <title>TermAway</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css?v=12">
  <!-- Apply theme immediately to prevent flash -->
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <!-- Load xterm and addons -->
  <script src="/xterm/lib/xterm.js"></script>
  <script src="/xterm-addon-fit/lib/addon-fit.js"></script>
  <script src="/xterm-addon-webgl/lib/addon-webgl.js"></script>
  <script src="/xterm-addon-web-links/lib/addon-web-links.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header with tabs and controls -->
    <header id="header" role="banner">
      <div id="tabs-container">
        <div id="tabs" role="tablist" aria-label="Terminal sessions"></div>
        <button id="new-session-btn" title="Create new session" aria-label="Create new session"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg></button>
      </div>
      <div id="status-container">
        <button class="header-btn" id="toolbar-toggle" title="Toggle keyboard toolbar" aria-label="Toggle keyboard toolbar" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 8h.01" /><path d="M12 12h.01" /><path d="M14 8h.01" /><path d="M16 12h.01" /><path d="M18 8h.01" /><path d="M6 8h.01" /><path d="M7 16h10" /><path d="M8 12h.01" /><rect width="20" height="16" x="2" y="4" rx="2" /></svg></button>
        <button class="header-btn" id="theme-toggle-header" title="Toggle theme" aria-label="Toggle theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v2" /><path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715" /><path d="M16 12a4 4 0 0 0-4-4" /><path d="m19 5-1.256 1.256" /><path d="M20 12h2" /></svg></button>
        <button class="header-btn" id="settings-btn-header" title="Settings" aria-label="Open settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg></button>
        <span id="connection-status" class="connecting" role="status" aria-live="polite" title="Connection status">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-text">Connecting...</span>
        </span>
        <button class="header-btn" id="disconnect-btn" title="Disconnect" aria-label="Disconnect from server" style="display:none;"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10" /><path d="M18.4 6.6a9 9 0 1 1-12.77.04" /></svg></button>
      </div>
    </header>

    <!-- Touch toolbar - toggleable keyboard helpers -->
    <div id="touch-toolbar" class="hidden">
      <button class="toolbar-btn modifier" data-modifier="ctrl">Ctrl</button>
      <button class="toolbar-btn modifier" data-modifier="alt">Alt</button>
      <span class="toolbar-separator"></span>
      <button class="toolbar-btn" data-key="Escape">Esc</button>
      <button class="toolbar-btn" data-key="Tab">Tab</button>
      <span class="toolbar-separator"></span>
      <button class="toolbar-btn" data-key="ArrowUp"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7" /><path d="M12 19V5" /></svg></button>
      <button class="toolbar-btn" data-key="ArrowDown"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14" /><path d="m19 12-7 7-7-7" /></svg></button>
      <button class="toolbar-btn" data-key="ArrowLeft"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg></button>
      <button class="toolbar-btn" data-key="ArrowRight"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></button>
      <span class="toolbar-separator"></span>
      <button class="toolbar-btn" data-sequence="ctrl+c">^C</button>
      <button class="toolbar-btn" data-sequence="ctrl+d">^D</button>
      <button class="toolbar-btn" data-sequence="ctrl+z">^Z</button>
      <span class="toolbar-spacer"></span>
      <button class="toolbar-btn icon" id="font-decrease" title="Decrease font"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 12 4 4 4-4" /><path d="M18 16V7" /><path d="m2 16 4.039-9.69a.5.5 0 0 1 .923 0L11 16" /><path d="M3.304 13h6.392" /></svg></button>
      <button class="toolbar-btn icon" id="font-increase" title="Increase font"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 11 4-4 4 4" /><path d="M18 16V7" /><path d="m2 16 4.039-9.69a.5.5 0 0 1 .923 0L11 16" /><path d="M3.304 13h6.392" /></svg></button>
    </div>

    <!-- Terminal container -->
    <main id="terminal-container" role="main">
      <div id="terminal" aria-label="Terminal output"></div>
      <button id="scroll-to-bottom" class="scroll-hidden" title="Scroll to bottom" aria-label="Scroll to bottom">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17V3" /><path d="m6 11 6 6 6-6" /><path d="M19 21H5" /></svg>
      </button>
      <div id="no-session" class="hidden">
        <div class="no-session-content">
          <h2>No Active Session</h2>
          <p>Create a new session to get started</p>
          <button id="create-first-session" class="btn-primary">Create Session</button>
        </div>
      </div>
    </main>

    <!-- Settings backdrop -->
    <div id="settings-backdrop" class="hidden"></div>

    <!-- Settings panel -->
    <div id="settings-panel" class="hidden" role="dialog" aria-label="Settings">
      <div class="settings-content">
        <div class="settings-header">
          <h3>Settings</h3>
          <button id="settings-close" class="settings-close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
        </div>
        <div class="settings-section">
          <label>Quick Commands</label>
          <div id="quick-commands">
            <button class="quick-cmd" data-cmd="ls -la">ls -la</button>
            <button class="quick-cmd" data-cmd="git status">git status</button>
            <button class="quick-cmd" data-cmd="git diff">git diff</button>
            <button class="quick-cmd" data-cmd="npm run dev">npm run dev</button>
          </div>
          <div class="add-command">
            <input type="text" id="new-cmd-input" placeholder="Add command...">
            <button id="add-cmd-btn" class="btn-small">+</button>
          </div>
        </div>
        <div class="settings-section">
          <label>Font Size: <span id="font-size-display">14px</span></label>
          <input type="range" id="font-size-slider" min="10" max="24" value="14">
        </div>
      </div>
    </div>

    <!-- Context menu for tabs -->
    <div id="context-menu" class="hidden">
      <div class="context-menu-item" data-action="rename">Rename Session</div>
      <div class="context-menu-item" data-action="kill">Kill Session</div>
    </div>

    <!-- Modal for new session name -->
    <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal">
        <h3 id="modal-title">New Session</h3>
        <input type="text" id="modal-input" placeholder="Session name" autocomplete="off" aria-label="Session name">
        <div id="modal-buttons">
          <button id="modal-cancel" class="btn-secondary">Cancel</button>
          <button id="modal-confirm" class="btn-primary">Create</button>
        </div>
      </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container" aria-live="polite" aria-relevant="additions"></div>
  </div>

  <script src="terminal.js?v=19"></script>
</body>
</html>
